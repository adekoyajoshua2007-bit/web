<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Netra Messenger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}


/* =========================
   NAVBAR
========================= */

.navbar{

    height:70px;

    background:#ffffff;

    border-bottom:1px solid #e5e8ef;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 28px;

    position:sticky;

    top:0;

    z-index:100;
}


.logo{

    font-size:26px;

    font-weight:800;

    color:#1877f2;

    letter-spacing:-1px;
}


.nav-right{

    display:flex;

    align-items:center;

    gap:12px;
}


/* SETTINGS BUTTON */

.settings-btn{

    width:44px;

    height:44px;

    border:none;

    border-radius:50%;

    background:#f1f3f7;

    color:#172033;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    cursor:pointer;

    transition:.25s;
}


.settings-btn:hover{

    background:#1877f2;

    color:white;

    transform:rotate(20deg);
}


.profile{

    width:42px;

    height:42px;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #1877f2,
        #6c5ce7
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:700;

}


/* =========================
   MAIN
========================= */

.messenger-container{

    max-width:1200px;

    margin:25px auto;

    padding:0 20px;
}


.messenger-card{

    background:#ffffff;

    border:1px solid #e3e7ee;

    border-radius:18px;

    min-height:calc(100vh - 120px);

    overflow:hidden;

}


/* =========================
   HEADER
========================= */

.messenger-header{

    padding:24px;

    border-bottom:1px solid #e7eaf0;
}


.header-title{

    display:flex;

    justify-content:space-between;

    align-items:center;
}


.header-title h1{

    font-size:28px;

    font-weight:800;
}


.new-message{

    background:#1877f2;

    border:none;

    color:white;

    padding:11px 18px;

    border-radius:10px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;
}


.new-message:hover{

    background:#0d68df;

    transform:translateY(-1px);
}


/* =========================
   SEARCH
========================= */

.search-box{

    margin-top:20px;

    background:#f2f4f8;

    border-radius:12px;

    padding:12px 15px;

    display:flex;

    align-items:center;

    gap:10px;
}


.search-box input{

    border:none;

    outline:none;

    background:transparent;

    width:100%;

    font-size:15px;
}


/* =========================
   FILTERS
========================= */

.filters{

    display:flex;

    gap:8px;

    padding:15px 24px;

    border-bottom:1px solid #e7eaf0;
}


.filter{

    border:none;

    padding:9px 16px;

    border-radius:20px;

    background:#f1f3f7;

    cursor:pointer;

    font-weight:600;

    color:#4b5565;
}


.filter.active{

    background:#1877f2;

    color:white;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state{

    min-height:470px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:40px 20px;
}


.empty-icon{

    width:95px;

    height:95px;

    border-radius:50%;

    background:#eef4ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:42px;

    margin-bottom:25px;
}


.empty-state h2{

    font-size:24px;

    margin-bottom:10px;

    font-weight:800;
}


.empty-state p{

    max-width:430px;

    color:#7a8495;

    line-height:1.6;

    font-size:14px;

    margin-bottom:25px;
}


.start-chat{

    border:none;

    background:#1877f2;

    color:white;

    padding:13px 22px;

    border-radius:10px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}


.start-chat:hover{

    background:#0d68df;

    transform:translateY(-2px);
}


/* =========================
   NEW MESSAGE MENU
========================= */

.new-message-panel{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:500;
}


.new-message-box{

    background:white;

    width:420px;

    max-width:92%;

    border-radius:18px;

    padding:28px;

    box-shadow:0 20px 60px rgba(0,0,0,.2);
}


.new-message-box h2{

    margin-bottom:10px;
}


.new-message-box p{

    color:#7a8495;

    font-size:14px;

    line-height:1.5;

    margin-bottom:20px;
}


.panel-buttons{

    display:flex;

    gap:10px;
}


.panel-btn{

    flex:1;

    border:none;

    padding:12px;

    border-radius:10px;

    cursor:pointer;

    font-weight:600;
}


.panel-primary{

    background:#1877f2;

    color:white;
}


.panel-secondary{

    background:#f1f3f7;

    color:#172033;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{

        padding:0 15px;
    }


    .messenger-container{

        margin:0;

        padding:0;
    }


    .messenger-card{

        border:none;

        border-radius:0;

        min-height:calc(100vh - 70px);
    }


    .messenger-header{

        padding:20px 16px;
    }


    .header-title h1{

        font-size:24px;
    }


    .new-message{

        padding:10px 13px;

        font-size:12px;
    }


    .filters{

        padding:12px 16px;

        overflow-x:auto;
    }


    .empty-state{

        min-height:500px;

        padding:30px 20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="logo">
        Netra
    </div>


    <div class="nav-right">

        <!-- ACTIVE SETTINGS -->

        <button
            class="settings-btn"
            onclick="openSettings()"
            title="Settings"
            aria-label="Open Settings"
        >
            ⚙️
        </button>


        <!-- USER PROFILE -->

        <div
            class="profile"
            id="profileInitial"
        >
            U
        </div>

    </div>

</header>



<!-- =========================
     MESSENGER
========================= -->

<main class="messenger-container">

<div class="messenger-card">


    <!-- HEADER -->

    <div class="messenger-header">

        <div class="header-title">

            <h1>
                Messenger
            </h1>


            <button
                class="new-message"
                onclick="openNewMessage()"
            >
                + New message
            </button>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            🔎

            <input
                type="text"
                id="searchInput"
                placeholder="Search conversations..."
            >

        </div>

    </div>



    <!-- FILTERS -->

    <div class="filters">

        <button
            class="filter active"
        >
            All
        </button>


        <button
            class="filter"
        >
            Unread
        </button>


        <button
            class="filter"
        >
            Friends
        </button>

    </div>



    <!-- NEW USER EMPTY STATE -->

    <section class="empty-state">

        <div class="empty-icon">
            💬
        </div>


        <h2>
            No conversations yet
        </h2>


        <p>
            Your conversations will appear here when you
            connect with friends on Netra. Add friends and
            start your first conversation.
        </p>


        <button
            class="start-chat"
            onclick="goToFriends()"
        >
            Find Friends
        </button>

    </section>


</div>

</main>



<!-- =========================
     NEW MESSAGE PANEL
========================= -->

<div
    class="new-message-panel"
    id="newMessagePanel"
>

    <div class="new-message-box">

        <h2>
            Start a new conversation
        </h2>


        <p>
            You don't have any friends available to
            message yet. Find and add friends first.
        </p>


        <div class="panel-buttons">

            <button
                class="panel-btn panel-secondary"
                onclick="closeNewMessage()"
            >
                Cancel
            </button>


            <button
                class="panel-btn panel-primary"
                onclick="goToFriends()"
            >
                Find Friends
            </button>

        </div>

    </div>

</div>



<script>

/* =========================
   SETTINGS
========================= */

function openSettings(){

    window.location.href =
        "settings.html";

}


/* =========================
   FRIENDS
========================= */

function goToFriends(){

    window.location.href =
        "Friendspage.html";

}


/* =========================
   NEW MESSAGE
========================= */

function openNewMessage(){

    document
    .getElementById("newMessagePanel")
    .style.display = "flex";

}


function closeNewMessage(){

    document
    .getElementById("newMessagePanel")
    .style.display = "none";

}


/* =========================
   CLOSE PANEL WHEN CLICKING
   OUTSIDE THE BOX
========================= */

document
.getElementById("newMessagePanel")
.addEventListener("click", function(event){

    if(event.target === this){

        closeNewMessage();

    }

});


/* =========================
   SEARCH
========================= */

document
.getElementById("searchInput")
.addEventListener("input", function(){

    /*
       No conversations exist yet,
       so the search remains empty until
       Firebase loads real conversations.
    */

});


/* =========================
   PROFILE
========================= */

/*
   Later Firebase Authentication
   will automatically replace this
   with the logged-in user's profile
   picture/initial.
*/

</script>


</body>

</html>
